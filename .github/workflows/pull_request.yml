name: Pull Request

on: pull_request

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # dorny/test-reporter
      pull-requests: write # sticky coverage comment
      id-token: write # nora session token

    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
      
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # kt3k/license_checker v1.0.6 (deno license_checker 3.1.2) inline: its Docker image
    # pulled ubuntu and deno from outside nora (packages.maestra.io, issues-maestra#1649).
    # Same rule: every file matching a .licenserc.json glob (minus "ignore") carries every
    # line in its first 8 KB; any miss fails the step.
    - name: Check License Lines
      shell: python3 {0}
      run: |
        import json, pathlib, sys

        cfgs = json.load(open(".licenserc.json"))
        ok = True
        for cfg in cfgs if isinstance(cfgs, list) else [cfgs]:
            cfg = dict(cfg)
            ignore = cfg.pop("ignore", [])
            for pattern, lines in cfg.items():
                lines = [lines] if isinstance(lines, str) else lines
                for f in sorted(pathlib.Path().glob(pattern)):
                    if not f.is_file() or any(p in str(f) for p in ignore):
                        continue
                    if all(line.encode() in f.read_bytes()[:8192] for line in lines):
                        print(f, "... ok")
                    else:
                        print(f, "missing copyright!")
                        ok = False
        sys.exit(0 if ok else 1)
      
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 9
        
    - name: Build
      run: dotnet build Engine/Quokka.slnx --configuration Release
 
    - name: Run tests net7
      run: >
        dotnet test Engine/Quokka.slnx --no-build -c Release -f net7.0 --logger "trx;LogFileName=test-results-net7.trx" || true
        
    - name: Run tests net8
      run: >
        dotnet test Engine/Quokka.slnx --no-build -c Release -f net8.0 --logger "trx;LogFileName=test-results-net8.trx" || true

    - name: Run tests net9
      run: >
        dotnet test Engine/Quokka.slnx --no-build -c Release -f net9.0 --logger "trx;LogFileName=test-results-net9.trx" --collect:"XPlat Code Coverage" --results-directory coverage || true

    - name: Test report
      uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
      if: always()
      with:
          name: .NET tests
          path: "**/test-results-net*.trx"
          reporter: dotnet-trx

    # irongut/CodeCoverageSummary v1.3.0's image through nora (issues-maestra#1649), same
    # arguments (the action's defaults for the rest).
    - name: nora session token
      id: nora
      uses: maestra-io/github-actions/nora-session@eeb0232e51c60769be4d623dfd8a4b6a4af8a9be # v1.95.0
    - name: docker login nora
      env:
        NORA_TOKEN: ${{ steps.nora.outputs.token }}
      run: printf '%s' "$NORA_TOKEN" | docker login packages.maestra.io -u token --password-stdin
    - name: Code Coverage Summary Report
      run: >
        docker run --rm -v "$PWD:$PWD" -w "$PWD"
        packages.maestra.io/ghcr/irongut/codecoveragesummary:v1.3.0@sha256:daebdede906ca84788b94378a1504a88d38621198d3836df24d60d6215e64a86
        --files 'coverage/*/coverage.cobertura.xml' --badge true --fail false --format markdown
        --hidebranch false --hidecomplexity false --indicators true --output both --thresholds '50 75'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        recreate: true
        path: code-coverage-results.md          